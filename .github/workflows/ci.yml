name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck / Lint / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      # このリポジトリは親 monorepo (nezumi0627/vyline) の packages/protocol。
      # workspace:* の依存 (@vyline/line-types / @vyline/loose-types) を解決するため
      # 単一ワークスペースを組み立ててから bun install する。
      - uses: actions/checkout@v4
        with:
          path: workspace/packages/protocol

      - name: Checkout sibling packages from monorepo
        uses: actions/checkout@v4
        with:
          repository: nezumi0627/vyline
          ref: main
          sparse-checkout: |
            Vyline/packages/line-types
            Vyline/packages/loose-types
          path: monorepo

      - name: Assemble workspace
        run: |
          mv "$GITHUB_WORKSPACE/monorepo/Vyline/packages/line-types" packages/
          mv "$GITHUB_WORKSPACE/monorepo/Vyline/packages/loose-types" packages/
          cat > package.json <<'EOF'
          {
            "name": "vyline-api-ci",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck (src)
        run: bun run --cwd packages/protocol typecheck

      - name: Lint (biome)
        run: bun run --cwd packages/protocol lint

      - name: Build (stack .d.ts)
        run: bun run --cwd packages/protocol build
